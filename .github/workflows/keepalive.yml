name: Workflow Keep Alive

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  keep-everything-alive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh all workflows in this repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          workflows=$(gh api /repos/${{ github.repository }}/actions/workflows --jq '.workflows[].id')

          for id in $workflows; do
            gh api -X PUT /repos/${{ github.repository }}/actions/workflows/$id/enable
          done
